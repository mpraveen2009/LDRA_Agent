name: LDRA Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ldra-pipeline:
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: "80"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Person 1-3 scripts if available
        shell: bash
        run: |
          set -e
          if [ -f src/commit_detector.py ]; then python src/commit_detector.py; fi
          if [ -f src/test_case_generator.py ]; then python src/test_case_generator.py; fi
          if [ -f src/test_executor.py ]; then python src/test_executor.py; fi

      - name: Create fallback results if missing
        shell: bash
        run: |
          if [ ! -f results.json ]; then
            cat > results.json <<'EOF'
            {
              "total_tests": 0,
              "passed": 0,
              "failed": 1,
              "coverage": {
                "statement": 0,
                "branch": 0,
                "mcdc": 0
              },
              "failures": [
                {
                  "file": "pipeline",
                  "function": "precheck",
                  "reason": "results.json was not generated by Person 3 step"
                }
              ]
            }
            EOF
          fi

      - name: Generate reports
        run: |
          python src/report_generator.py \
            --results results.json \
            --markdown reports/test_report.md \
            --html reports/test_report.html \
            --summary reports/summary.json

      - name: Publish PR comment and status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python src/github_reporter.py \
            --report reports/test_report.md \
            --results results.json \
            --coverage-threshold ${COVERAGE_THRESHOLD}

      - name: Upload reports and logs
        uses: actions/upload-artifact@v4
        with:
          name: ldra-reports-and-logs
          path: |
            reports/
            results.json
